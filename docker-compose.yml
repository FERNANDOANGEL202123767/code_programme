services:
  database:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: code2024
      MYSQL_DATABASE: c_program
    ports:
      - "3306:3306"
    volumes:
      - ./sql-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
      timeout: 5s
      start_period: 30s

  auth-service:
    build: ./auth-service
    ports:
      - "3001:3001"
    depends_on:
      database:
        condition: service_healthy

  payment-service:
    build: ./payment-service
    ports:
      - "3002:3002"
    depends_on:
      - database

  certificate-service:
    build: ./certificate-service
    ports:
      - "3003:3003"
    depends_on:
      - database

  notification-service:
    build: ./notification-service
    ports:
      - "3004:3004"
    depends_on:
      - database

  feedback-service:
    build: ./feedback-service
    ports:
      - "3005:3005"
    depends_on:
      - database

  material-calendar-service:
    build: ./material-calendar-service
    ports:
      - "3006:3006"
    depends_on:
      - database

  db-service:
    build: ./db-service
    depends_on:
      - database

  api-gateway:
    build: ./api-gateway
    ports:
      - "3016:3016"

  frontend:
    build:
      context: ./frontend
    ports:
      - "3010:3010"
    depends_on:
      - database

  client:
    build:
      context: ./client
    ports:
      - "3000:3000"
    depends_on:
      - database
